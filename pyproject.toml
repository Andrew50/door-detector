[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "door_detector"
version = "0.1.0"
description = "Door detection in floor plans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "streamlit~=1.48.0",
    "streamlit-drawable-canvas==0.9.3",
]

[project.scripts]
door-detector-step1 = "door_detector.step1_pipeline:main"
door-detector-step2 = "door_detector.step2_pipeline:main"
door-detector-reweight = "door_detector.reweight_fit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["door_detector*"]

[tool.setuptools.package-data]
# Bundle the built PDF.js component so `pip install -e .` and packaged installs work
# without requiring a node build step at runtime.
"door_detector.ui.pdfjs_component" = ["frontend/dist/**/*"]



