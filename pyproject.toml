[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "door_detector"
version = "0.1.0"
description = "Door detection in floor plans"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
door-detector-step1 = "door_detector.step1_pipeline:main"

[tool.setuptools]
packages = ["door_detector"]



